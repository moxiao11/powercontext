name: stepfun-tide
services:
  seekdb:
    image: oceanbase/seekdb@sha256:4db4961869d554313520d6081fca29265ba6da6db7313311bd8acbed771a956b
    ports: ["127.0.0.1:12883:2881"]
    environment:
      SEEKDB_DATABASE: stepfun
      MEMORY_LIMIT: 2G
      CPU_COUNT: 2
    volumes: ["seekdb-data:/var/lib/seekdb"]
    healthcheck:
      test: ["CMD-SHELL", "mysql --host=127.0.0.1 --port=2881 -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
volumes:
  seekdb-data:
    name: stepfun-seekdb-data
