[project]
name = "labtrace-backend"
version = "0.1.0"
description = "LabTrace backend: research knowledge base and experiment tracking on OceanBase seekdb, long-term memory on PowerContext"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymysql>=1.1",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
seekdb = [
    # Embedded seekdb runtime; Linux/macOS only (see docs/SETUP.md)
    "pylibseekdb>=1.4.0; sys_platform == 'linux' or sys_platform == 'darwin'",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
