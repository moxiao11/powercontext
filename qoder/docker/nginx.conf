server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upload limit must stay above the backend's LABTRACE_MAX_UPLOAD_MB (default 20 MB).
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /api/ {
        # Re-resolve Docker service DNS after a backend container is recreated.
        # Resolving only at nginx startup leaves an otherwise healthy UI with 502s.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $labtrace_backend http://backend:8100;
        proxy_pass $labtrace_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed asset filenames are immutable; the HTML entry point must never be cached.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
