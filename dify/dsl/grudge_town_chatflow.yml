    - data:
        code: "import json\n\nNPC_LABELS = {\n    \"baker\": \"\\U0001F35E 面包店老板老张\"\
          ,\n    \"guard\": \"\\U0001F6E1\\uFE0F 守卫阿铁\",\n    \"witch\": \"\\U0001F319\
          \ 女巫莉莉丝\",\n}\n\n\ndef _safe(data, key, default=\"\"):\n    value = data.get(key,\
          \ default)\n    return \"\" if value is None else value\n\n\ndef main(body:\
          \ str) -> dict:\n    \"\"\"解析后端响应：direct 直接渲染，npc 交给对应角色的 LLM 节点。\"\"\"\n\
          \    try:\n        data = json.loads(body)\n    except Exception:\n    \
          \    return {\n            \"reply_type\": \"direct\",\n            \"rendered_text\"\
          : \"\\u26a0\\ufe0f 游戏服务暂时没有响应，请稍后重试（后端可能未启动）。\",\n            \"npc_header\"\
          : \"\",\n            \"context_text\": \"\",\n            \"footer\": \"\
          \",\n        }\n    reply_type = _safe(data, \"reply_type\", \"direct\"\
          )\n    day = data.get(\"day\", 1)\n    location_name = _safe(data, \"location_name\"\
          )\n    npc = _safe(data, \"npc\")\n    npc_name = _safe(data, \"npc_name\"\
          )\n    header = \"\\U0001F3D8\\uFE0F 记仇小镇 \\u00b7 第 {} 天\\n\\U0001F4CD 当前地点：{}\"\
          .format(day, location_name)\n    npc_header = header\n    if npc:\n    \
          \    npc_header += \"\\n\\n\" + NPC_LABELS.get(npc, npc_name) + \"：\"\n\
          \    parts = []\n    for key in (\"changes_block\", \"news_block\", \"ending_block\"\
          ):\n        block = _safe(data, key)\n        if block:\n            parts.append(block)\n\
          \    footer = (\"\\n\\n\\u2501\\u2501\\u2501\\u2501\\u2501\\u2501\\u2501\\\
          u2501\\u2501\\u2501\\u2501\\u2501\\n\" + \"\\n\\n\".join(parts)) if parts\
          \ else \"\"\n    return {\n        \"reply_type\": reply_type,\n       \
          \ \"rendered_text\": _safe(data, \"rendered_text\"),\n        \"npc\": npc,\n\
          \        \"npc_header\": npc_header,\n        \"context_text\": _safe(data,\
          \ \"context_text\"),\n        \"footer\": footer,\n    }\n"
