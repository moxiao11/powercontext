    - data:
        code: "import json\nimport re\n\n\ndef normalize(text):\n    return re.sub(r\"\
          \\s+\", \"\", text or \"\")\n\n\nMOVE_ALIASES = [\n    (\"前往面包店|去面包店|走进面包店|面包店\"\
          , \"bakery\"),\n    (\"前往城门|去城门|走向城门|城门口|找守卫|见守卫\", \"gate\"),\n    (\"\
          前往魔法屋|去魔法屋|走进魔法屋|魔法屋|找女巫|见女巫\", \"witch_hut\"),\n    (\"回广场|去广场|小镇广场|返回广场\"\
          , \"square\"),\n]\n\nVIEW_ALIASES = [\n    (\"查看状态|我的状态|当前状态\", \"status\"\
          ),\n    (\"查看背包|我的背包|打开背包\", \"inventory\"),\n    (\"查看任务|我的任务|任务列表\", \"\
          quests\"),\n    (\"查看小镇新闻|小镇新闻|查看新闻|最新消息\", \"news\"),\n]\n\n\ndef main(query:\
          \ str) -> dict:\n    text = normalize(query)\n    chat = {\"is_command\"\
          : \"false\", \"intent_json\": json.dumps({\"action_type\": \"chat\"}, ensure_ascii=False)}\n\
          \    if not text:\n        return chat\n    if re.fullmatch(r\"开始游戏|开始新游戏|新游戏|开局\"\
          , text):\n        return {\"is_command\": \"true\", \"intent_json\": json.dumps({\"\
          action_type\": \"start_game\"})}\n    if re.fullmatch(r\"重新开始|重置游戏|重新来过|重来\"\
          , text):\n        return {\"is_command\": \"true\", \"intent_json\": json.dumps({\"\
          action_type\": \"reset\"})}\n    for pattern, kind in VIEW_ALIASES:\n  \
          \      if re.fullmatch(pattern, text):\n            return {\"is_command\"\
          : \"true\", \"intent_json\": json.dumps({\"action_type\": \"view\", \"view_kind\"\
          : kind})}\n    if len(text) <= 10:\n        for pattern, location in MOVE_ALIASES:\n\
          \            if re.search(pattern, text):\n                return {\"is_command\"\
          : \"true\", \"intent_json\": json.dumps({\"action_type\": \"move\", \"target\"\
          : location})}\n    return chat\n"
        code_language: python3
