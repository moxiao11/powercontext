    - data:
        code: "\"\"\"Standalone helpers also embedded in Dify Code nodes (stdlib only).\"\
          \"\"\nfrom __future__ import annotations\n\nimport json\nimport re\n\nINTENT_ACTIONS\
          \ = {\n    \"chat\", \"lie_identity\", \"steal\", \"buy\", \"give_gift\"\
          , \"help\",\n    \"apologize\", \"compensate\", \"threaten\", \"spread_rumor\"\
          ,\n}\n\n\ndef strip_thinking(text: str) -> str:\n    \"\"\"Keep final output\
          \ when a provider merges reasoning into its text field.\"\"\"\n    cleaned\
          \ = re.sub(r\"<think\\b[^>]*>.*?</think\\s*>\", \"\", text or \"\", flags=re.I\
          \ | re.S)\n    cleaned = re.sub(r\"<think\\b[^>]*>.*\\Z\", \"\", cleaned,\
          \ flags=re.I | re.S)\n    return re.sub(r\"<!--.*?-->\", \"\", cleaned,\
          \ flags=re.S).strip()\n\n\ndef parse_intent_output(text: str) -> dict:\n\
          \    cleaned = strip_thinking(text)\n    decoder = json.JSONDecoder()\n\
          \    for opening in re.finditer(r\"\\{\", cleaned):\n        try:\n    \
          \        value, _ = decoder.raw_decode(cleaned[opening.start():])\n    \
          \    except ValueError:\n            continue\n        if isinstance(value,\
          \ dict) and value.get(\"action_type\") in INTENT_ACTIONS:\n            return\
          \ {\"intent_json\": json.dumps(value, ensure_ascii=False)}\n    return {\"\
          intent_json\": json.dumps({\"action_type\": \"chat\"})}\n\n\ndef format_npc_reply(text:\
          \ str) -> dict:\n    return {\"text\": strip_thinking(text) or \"对方若有所思，暂时没有回答。请再说一句。\"\
          }\n\n\ndef main(text: str) -> dict:\n    return parse_intent_output(text)\n"
